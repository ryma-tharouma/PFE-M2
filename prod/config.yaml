vector_db:
  # For remote Qdrant server (provide host + port)
  host: null # e.g., "localhost" or "qdrant.example.com"
  port: 6333 # default Qdrant port
  api_key: null # if authentication is required
  # For local file-based Qdrant (use path instead of host)
  path: "qdrant_data/" # local storage path

# -----------------------------------------------------------------------------
# Chunker (splits sections into token-bounded chunks)
# -----------------------------------------------------------------------------
chunker:
  max_tokens: 256 # maximum tokens per chunk
  overlap: 50 # overlapping tokens between consecutive chunks
  tokenizer_model: "BAAI/bge-m3" # HuggingFace tokenizer name

# -----------------------------------------------------------------------------
# Aggregator (collapses chunk-level results to section-level)
# -----------------------------------------------------------------------------
aggregator:
  top_k: 3 # max number of sections to return after aggregation

# -----------------------------------------------------------------------------
# Embedder (sentence transformer for dense embeddings)
# -----------------------------------------------------------------------------
embedder:
  model_name: "BAAI/bge-m3" # HuggingFace sentence-transformer model
  device: "cpu" # "cpu" or "cuda"
  batch_size: 32 # encoding batch size

# -----------------------------------------------------------------------------
# Retriever (vector search and optional reranking)
# -----------------------------------------------------------------------------
retriever:
  search_top_k: 20 # number of chunks to retrieve from vector DB
  sections_top_k: 3 # number of final sections after aggregation
  # Reranking is controlled in the "reranker" section below

# -----------------------------------------------------------------------------
# Reranker (cross-encoder, optional)
# -----------------------------------------------------------------------------
reranker:
  enabled: false # set to true to use reranking
  model_name: "BAAI/bge-reranker-v2-m3"
  batch_size: 32
  top_k_rerank: 10 # number of top chunks to rerank

# -----------------------------------------------------------------------------
# Generator (LLM for answer generation)
# -----------------------------------------------------------------------------
generator:
  device: "cpu" # "cpu" or "cuda"
  prompt_file: "prompt_1.txt" # path to system prompt template (required)
  generation_kwargs: {} # optional overrides for any generation param

  # CPU-specific (llama-cpp)
  gguf_path: "../models/Qwen3.5-4B-Q4_K_S.gguf" # required if device=cpu
  n_ctx: 8000
  n_threads: 4
  n_batch: 1024

  # GPU-specific (HuggingFace)
  hf_model_name: "Qwen/Qwen3.5-4B" # required if device=cuda
  torch_dtype: "float16" # float16, bfloat16, float32

  # Shared generation defaults (can be overridden via generation_kwargs)
  max_tokens: 1024 # CPU default; GPU uses 256 unless overridden
  temperature: 0.1
  top_p: 0.8
  top_k: 20
  # CPU-only:
  min_p: 0.0
  presence_penalty: 1.5
  repeat_penalty: 1.1
  # GPU-only:
  do_sample: true # enabling sampling (if false, greedy)

# -----------------------------------------------------------------------------
# RAG pipeline (routing logic)
# -----------------------------------------------------------------------------
rag:
  routing_threshold_1: 0.72 # top score must exceed second by this to use FAQ path
  routing_threshold_2: 0.13
# -----------------------------------------------------------------------------
# Assistant (stateful session management)
# -----------------------------------------------------------------------------
assistant:
  max_turns: 2 # number of conversation turns to keep in history
  verbose: true # enable detailed logging and timing output
  log_dir: "logs" # directory for rotating log files
  # Optional (for future scaling) – not yet implemented in code:
  # session_backend: "memory"    # "memory", "redis", or "sqlite"
  # redis_url: "redis://localhost:6379"
  # sqlite_path: "sessions.db"

# -----------------------------------------------------------------------------
# Rewriter (separate small model for query rewriting)
# Only used when query_context.mode = "rewrite"
# -----------------------------------------------------------------------------
rewriter:
  device: "cpu" # "cpu" or "cuda"
  max_new_tokens: 512
  temperature: 0.1

  # CPU (llama-cpp)
  gguf_path: "/home/liza/PFE_M2/PFE-M2/models/Qwen3.5-2B-Q4_K_S.gguf"
  n_ctx: 1024
  n_threads: 4
  n_batch: 128

  # GPU (HuggingFace)
  hf_model_name: "" # e.g. "Qwen/Qwen3.5-2B"
  torch_dtype: "float16"

# -----------------------------------------------------------------------------
# Query context  –  enriches the retrieval query using the previous turn
#
#   mode: "none"    – retrieval uses the raw current query (no history)
#         "concat"  – prepends the previous *original* user query via a template
#         "rewrite" – a separate model rewrites the current query into a
#                     standalone form, chaining from the last rewritten query
# -----------------------------------------------------------------------------
query_context:
  mode: "rewrite"
  concat_template: "requete precedente: {prev_query}. requete courante: {current_query}"