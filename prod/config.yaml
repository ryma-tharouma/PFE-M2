# =============================================================================
# Central configuration for the RAG pipeline
# =============================================================================

# -----------------------------------------------------------------------------
# Vector Database (Qdrant)
# -----------------------------------------------------------------------------
vector_db:
  host: null # remote host ex "localhost" (null = use local path)
  port: 6333
  api_key: null
  path: "/home/liza/PFE_M2/PFE-M2/prod/qdrant_data/"
  hnsw_m: 16
  hnsw_ef_construct: 100
  hnsw_ef: 128

# -----------------------------------------------------------------------------
# Chunker
# -----------------------------------------------------------------------------
chunker:
  max_tokens: 256
  overlap: 50
  tokenizer_model: "BAAI/bge-m3"

# -----------------------------------------------------------------------------
# Aggregator
# -----------------------------------------------------------------------------
aggregator:
  top_k: 3

# -----------------------------------------------------------------------------
# Embedder
# -----------------------------------------------------------------------------
embedder:
  model_name: "BAAI/bge-m3"
  device: "cpu"
  batch_size: 32

# -----------------------------------------------------------------------------
# Retriever
# -----------------------------------------------------------------------------
retriever:
  search_top_k: 20
  sections_top_k: 3

# -----------------------------------------------------------------------------
# Reranker (optional cross-encoder)
# -----------------------------------------------------------------------------
reranker:
  enabled: false
  model_name: "BAAI/bge-reranker-v2-m3"
  batch_size: 10
  top_k_rerank: 10

# -----------------------------------------------------------------------------
# Generator (main answer LLM)
# -----------------------------------------------------------------------------
generator:
  device: "cpu" # "cpu" or "cuda"
  prompt_file: "prompt_1.txt"
  generation_kwargs: {}

  # CPU (llama-cpp)
  gguf_path: "../models/Qwen3.5-4B-Q4_K_S.gguf"
  n_ctx: 8144
  n_threads: 4
  n_batch: 128

  # GPU (HuggingFace)
  hf_model_name: "Qwen/Qwen3.5-4B"
  torch_dtype: "float16"

  # Shared generation defaults
  max_tokens: 1024
  temperature: 0.1
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  #presence_penalty: 1.5
  repeat_penalty: 1.1
  do_sample: true

# -----------------------------------------------------------------------------
# Rewriter (separate small model for query rewriting)
# Only used when query_context.mode = "rewrite"
# -----------------------------------------------------------------------------
rewriter:
  device: "cpu" # "cpu" or "cuda"
  max_new_tokens: 512
  temperature: 0.1

  # CPU (llama-cpp)
  gguf_path: "/home/liza/PFE_M2/PFE-M2/models/Qwen3.5-2B-Q4_K_S.gguf"
  n_ctx: 1024
  n_threads: 4
  n_batch: 128

  # GPU (HuggingFace)
  hf_model_name: "Qwen/Qwen3.5-2B"
  torch_dtype: "float16"

# -----------------------------------------------------------------------------
# Query context  –  enriches the retrieval query using the previous turn
#
#   mode: "none"    – retrieval uses the raw current query (no history)
#         "concat"  – prepends the previous *original* user query via a template
#         "rewrite" – a separate model rewrites the current query into a
#                     standalone form, chaining from the last rewritten query
# -----------------------------------------------------------------------------
query_context:
  mode: "rewrite"
  concat_template: "requete precedente: {prev_query}. requete courante: {current_query}"

# -----------------------------------------------------------------------------
# RAG pipeline
# -----------------------------------------------------------------------------
rag:
  routing_threshold_1: 0.72
  routing_threshold_2: 0.13

# -----------------------------------------------------------------------------
# Assistant
# -----------------------------------------------------------------------------
assistant:
  max_turns: 2 # conversation turns kept in history
  answer_truncate_words: 10 # truncate assistant answers to N words in history
  verbose: true
  log_dir: "logs"
