experiment:
  name: "phase_A1_base_smoke"
  description: "Smoke test: 1 conv, 3 turns, CPU, flat index, all strategies"
  results_dir: "data/results/{experiment_name}/"

database:
  type: "qdrant"
  path: "data/vector_db/"

indexing:
  db_types: ["qdrant"]
  modes: ["dense", "sparse", "hybrid"]
  index_types: ["flat"]
  batch_size: 16
  drop_existing: true

chunking:
  strategy: "adaptive"
  max_tokens: 8192
  overlap_tokens: 0

retrieval:
  max_retrieve_chunks: 20
  max_retrieve_sections: 5
  eval_k_chunks: [5, 10, 20]
  eval_k_sections: [1, 2, 3, 5]
  aggregation_method: "max"
  alpha: 0.7

multi_turn:
  enabled: true
  strategies: ["none", "weighted_concat"]
  window_size: 2
  weights: [0.3, 0.6, 1.0]
  context_truncation:
    enabled: true
    max_total_tokens: 8000
    truncate_strategy: "assistant_first"

routing:
  auto_optimize: true
  thresholds: {}

evaluation:
  query_sources:
    - name: "original"
      path: "data/conversations/original_turns.jsonl"
  auto_compare: false
  batch_size: 16
  parallel_configs: 1
  cache_embeddings: true
  checkpoint_every: 5

paths:
  apps_dir: "data/apps/"
  conversations_dir: "data/conversations/"

model:
  base_name: "BAAI/bge-m3"
  use_fp16: false
  device: "cpu"
