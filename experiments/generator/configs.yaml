configs:
  - id: "qwen_2b_history"
    model_name: "Qwen/Qwen3.5-2B"
    prompt_file: "default.txt"
    model_kwargs:
      device_map: "auto"
      torch_dtype: "float16"
    generation_kwargs:
      max_new_tokens: 1024
      do_sample: false
      #repetition_penalty: 1.1
    chat_template_kwargs:
      enable_thinking: false

