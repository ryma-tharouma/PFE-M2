# Default configuration for modular RAG system

# ----------------------------
# Embeddings & Vector Store
# ----------------------------
vector_store:
  type: "chroma" # default vector store backend
  params:
    persist_dir: "data/vector_store"
    app_namespace: null # can be overridden per app

embedder:
  type: "openai" # placeholder
  params:
    model_name: "vllm-embedding"
    batch_size: 16

# ----------------------------
# Retrieval
# ----------------------------
retriever:
  top_k: 5
  score_threshold: 0.75

reranker:
  type: "none" # options: none, model-based
  params: {}

# ----------------------------
# Query Rewriting
# ----------------------------
rewriter:
  type: "none"
  params: {}

# ----------------------------
# Generator
# ----------------------------
generator:
  type: "vllm"
  params:
    model_name: "vllm-gpt"
    temperature: 0.0

# ----------------------------
# Cache
# ----------------------------
cache:
  type: "redis"
  params:
    host: "localhost"
    port: 6379
    db: 0
    ttl: 3600

# ----------------------------
# Ticket System
# ----------------------------
ticketer:
  type: "glpi"
  params:
    url: "http://localhost:8080"
    api_token: ""

# ----------------------------
# Experiment / Logging
# ----------------------------
logging:
  level: "info"
  structured: true

random_seed: 42
